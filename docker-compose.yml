version: '3.8'

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "5173:5173"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
